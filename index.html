<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOTHING</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="rain"></div>

    <main class="container">

        <h1>NOTHING</h1>

        <p class="message">
            You don't have to do anything here.
        </p>

        <div class="time">
            00:00
        </div>

        <p class="people" id="people">
            1 person is doing nothing.
        </p>

        <button id="rainButton">Listen to rain</button>
        
        <audio id="rainAudio" loop>
            <source src="rain.mp3" type="audio/mpeg">
        </audio>

    </main>

    <script src="script.js"></script>
<script>
const rainContainer = document.querySelector(".rain");

for (let i = 0; i < 70; i++) {
    const drop = document.createElement("span");

    drop.className = "drop";

    drop.style.left = Math.random() * 100 + "%";

    drop.style.setProperty(
        "--duration",
        (0.6 + Math.random() * 1.0) + "s"
    );

    drop.style.setProperty(
        "--delay",
        (-Math.random() * 2) + "s"
    );

    rainContainer.appendChild(drop);
}
</script>

    <script>
(() => {
    const rainButton = document.getElementById("rainButton");
    const rainAudio = document.getElementById("rainAudio");
    const rain = document.querySelector(".rain");

    if (!rainButton || !rainAudio || !rain) {
        console.log("비 연동에 필요한 요소를 찾지 못했습니다.");
        return;
    }

    // 부드럽게 나타나고 사라지게 함
    rain.style.transition = "opacity 1.2s ease";

    // 처음에는 비를 보이게 유지
    rain.style.opacity = "1";

    let playing = false;

    rainButton.addEventListener("click", async () => {

        if (!playing) {
            try {
                await rainAudio.play();

                rain.style.opacity = "1";

                rainButton.textContent = "Stop the rain";

                playing = true;

            } catch (error) {
                console.log("빗소리 재생 실패:", error);
            }

        } else {

            rainAudio.pause();

            rain.style.opacity = "0";

            rainButton.textContent = "Listen to rain";

            playing = false;
        }
    });
})();
</script>
    
</body>
</html>
